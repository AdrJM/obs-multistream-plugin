<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <title>Chat Mod</title>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="chat_style.css">
    </head>
    <body>

        <div id="chat"></div>

        <div id="composer">
        <select id="platform-select">
            <option value="all">ALL</option>
            <option value="twitch">Twitch</option>
            <option value="kick">Kick</option>
            <option value="youtube">YouTube</option>
        </select>
        <input id="msg-input" type="text" placeholder="Napisz wiadomość..." maxlength="500">
        <button id="send-btn">Wyślij</button>
        </div>

        <div id="statusbar">
        <span>chat mod</span>
        <span id="ws-status">⬤ łączenie</span>
        </div>

        <script src="chat_script.js"></script>
    </body>
</html>
