<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Chat Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --twitch:  #9146FF;
    --kick:    #53FC18;
    --youtube: #FF0000;
    --tiktok:  #69C9D0;
    --bg-msg:  rgba(0, 0, 0, 0.6);
    --radius:  6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    width: 400px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px;
    overflow: hidden;
    font-family: 'Barlow', sans-serif;
  }

  #chat {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .msg {
    display: grid;
    grid-template-columns: auto auto 1fr;
    align-items: baseline;
    gap: 6px;
    background: var(--bg-msg);
    border-radius: var(--radius);
    padding: 6px 10px;
    backdrop-filter: blur(4px);
    border-left: 2px solid transparent;
    animation: slideIn 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .msg.twitch  { border-left-color: var(--twitch); }
  .msg.kick    { border-left-color: var(--kick); }
  .msg.youtube { border-left-color: var(--youtube); }
  .msg.tiktok  { border-left-color: var(--tiktok); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    line-height: 1.6;
    flex-shrink: 0;
  }

  .badge.twitch  { background: var(--twitch);  color: #fff; }
  .badge.kick    { background: var(--kick);     color: #000; }
  .badge.youtube { background: var(--youtube);  color: #fff; }
  .badge.tiktok  { background: #010101; color: var(--tiktok); border: 1px solid var(--tiktok); }

  .username {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .text {
    font-size: 13px;
    color: rgba(255,255,255,0.88);
    line-height: 1.4;
    word-break: break-word;
  }

  /* Status dot */
  #status {
    position: fixed;
    bottom: 6px;
    right: 8px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #444;
    transition: background 0.3s;
  }
  #status.ok  { background: var(--kick); }
  #status.err { background: var(--youtube); animation: pulse 1s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }
</style>
</head>
<body>
<div id="status"></div>
<div id="chat"></div>

<script>
const WS_URL   = "ws://localhost:5001";
const MAX_MSGS = 25;
const chat     = document.getElementById("chat");
const statusDot = document.getElementById("status");

// Deterministyczny kolor nicku
const COLORS = ["#FF6B6B","#FFD93D","#6BCB77","#4D96FF","#C77DFF","#FF9F1C","#2EC4B6","#F7B731","#45B7D1","#FF6EB4"];
function nickColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return COLORS[h % COLORS.length];
}

function badgeLabel(platform) {
  return { youtube: "YT", tiktok: "TT", kick: "Kick", twitch: "Twitch" }[platform] || platform;
}

function addMessage({ platform, username, message }) {
  const div = document.createElement("div");
  div.className = `msg ${platform}`;

  const badge = document.createElement("span");
  badge.className = `badge ${platform}`;
  badge.textContent = badgeLabel(platform);

  const nick = document.createElement("span");
  nick.className = "username";
  nick.style.color = nickColor(username);
  nick.textContent = username;

  const text = document.createElement("span");
  text.className = "text";
  text.textContent = message;

  div.append(badge, nick, text);
  chat.appendChild(div);

  while (chat.children.length > MAX_MSGS) {
    chat.removeChild(chat.firstChild);
  }

  // Scroll do najnowszej
  div.scrollIntoView({ behavior: "smooth" });
}

// WebSocket z auto-reconnect
let ws;
function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen  = () => { statusDot.className = "ok"; };
  ws.onclose = () => { statusDot.className = "err"; setTimeout(connect, 3000); };
  ws.onerror = () => { statusDot.className = "err"; };

  ws.onmessage = (e) => {
    try { addMessage(JSON.parse(e.data)); } catch {}
  };
}

connect();
</script>
</body>
</html>
